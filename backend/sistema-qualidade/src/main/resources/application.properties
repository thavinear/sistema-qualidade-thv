spring.application.name=sistema-qualidade
server.port=8081

# Banco de dados H2 (em memória, sem Docker)
spring.datasource.url=jdbc:h2:mem:sgq;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true 

# JWT
app.jwt.secret=chave_super_secreta_para_o_sgq_senac_1234567890
app.jwt.expiration-seconds=3600
app.auth.cookie-secure=false
app.auth.cookie-same-site=Lax
app.frontend.origin=http://localhost:5173