spring.application.name=sistema-qualidade
server.port=${PORT:8081}

# URL do banco: usa a variável do Render ou H2 local como fallback
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:sgq;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET:chave_super_secreta_para_o_sgq_senac_1234567890}
app.jwt.expiration-seconds=3600
app.auth.cookie-secure=${COOKIE_SECURE:false}
app.auth.cookie-same-site=${COOKIE_SAME_SITE:Lax}
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}