<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00284d">
  <title>Entrar | SGQ SENAC</title>
  <link rel="stylesheet" href="./src/auth.css">
</head>
<body class="auth-page" data-page="login">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-card-top">
        <a class="login-back-link" href="./index.html" aria-label="Voltar para o início">← Voltar para o Início</a>
      </div>
      <div class="login-logo-wrap"><img class="login-logo" src="/assets/senac-logo.png" alt="SENAC"><span class="login-logo-fallback" hidden>SENAC</span></div>
      <p class="auth-eyebrow">Sistema Integrado de Gestão da Qualidade</p>
      <h1 id="login-title">Acesse sua conta</h1>
      <p class="auth-subtitle">Entre para continuar no SGQ SENAC.</p>

      <form id="loginForm" novalidate>
        <div class="auth-field">
          <label for="loginEmail">E-mail</label>
          <input id="loginEmail" name="email" type="email" autocomplete="username" required aria-describedby="loginMessage" autofocus>
        </div>
        <div class="auth-field">
          <label for="loginPassword">Senha</label>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required aria-describedby="loginMessage">
        </div>
        <p id="loginMessage" class="auth-message" role="alert" aria-live="polite"></p>
        <button id="loginSubmit" class="auth-primary" type="submit">Entrar</button>
      </form>

      <button id="showRegister" class="auth-link" type="button">Criar uma conta</button>
      <form id="registerForm" novalidate hidden>
        <h2>Cadastro de usuário</h2>
        <div class="auth-field"><label for="registerName">Nome</label><input id="registerName" name="name" required maxlength="100" autocomplete="name"></div>
        <div class="auth-field"><label for="registerEmail">E-mail</label><input id="registerEmail" name="email" type="email" required maxlength="254" autocomplete="email"></div>
        <div class="auth-field"><label for="registerPassword">Senha (mínimo 10 caracteres)</label><input id="registerPassword" name="password" type="password" required minlength="10" maxlength="72" autocomplete="new-password"></div>
        <p id="registerMessage" class="auth-message" role="alert" aria-live="polite"></p>
        <button class="auth-primary" type="submit">Criar conta</button>
      </form>

      <button id="forgotPassword" class="auth-link" type="button">Esqueci minha senha</button>
      <p id="defaultAdminNotice" class="admin-notice" hidden>
      </p>
      <p class="auth-footer">Acesso restrito a usuários cadastrados.</p>
    </section>
  </main>
  <script type="module" src="./src/auth.js"></script>
</body>
</html>
